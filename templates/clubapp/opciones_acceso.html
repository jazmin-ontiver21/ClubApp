
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ClubApp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #111;
        }

        .contenedor {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 45px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 35px #00000012;
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            border-radius: 22px;
            background: #ff6b00;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            font-size: 29px;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .boton {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border-radius: 13px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: .2s;
        }

        .principal {
            background: #ff6b00;
            color: white;
        }

        .secundario {
            border: 2px solid #ff6b00;
            color: #111;
        }

        .boton:hover {
            transform: translateY(-2px);
        }

        .volver {
            display: inline-block;
            margin-top: 28px;
            color: #777;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <div class="logo">C</div>

        <h1>{{ nombre_perfil }}</h1>

        <p class="descripcion">
            ¿Ya tenés una cuenta o querés registrarte?
        </p>

        <a href="{% url 'registro' %}?rol={{ rol }}" class="boton principal">
            Registrarme
        </a>

        <a href="{% url 'iniciar_sesion' %}?rol={{ rol }}" class="boton secundario">
            Iniciar sesión
        </a>

        <a href="{% url 'seleccionar_perfil' %}" class="volver">
            ← Cambiar perfil
        </a>
    </main>
</body>
</html>
