
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubApp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 25px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            background: #ff6b00;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(255, 107, 0, 0.25);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .subtitulo {
            font-size: 16px;
            color: #777;
            margin-bottom: 45px;
        }

        .botones {
            width: 100%;
        }

        .boton {
            width: 100%;
            padding: 17px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
            display: block;
            background: #ff6b00;
            color: white;
            box-shadow: 0 6px 15px rgba(255, 107, 0, 0.25);
        }

        .boton:hover {
            transform: translateY(-2px);
        }

        .pie {
            margin-top: 45px;
            font-size: 13px;
            color: #999;
        }

        @media (min-width: 600px) {
            .contenedor {
                min-height: auto;
                border-radius: 25px;
                margin: 30px;
                box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
                padding: 55px 40px;
            }
        }
    </style>
</head>

<body>
    <main class="contenedor">
        <div class="logo">C</div>

        <h1>ClubApp</h1>

        <p class="subtitulo">
            Gestión deportiva de tu club
        </p>

        <div class="botones">
            <a href="{% url 'seleccionar_perfil' %}" class="boton">
                Comenzar
            </a>
        </div>

        <p class="pie">
            Tu club, todo en un solo lugar
        </p>
    </main>
</body>
</html>
